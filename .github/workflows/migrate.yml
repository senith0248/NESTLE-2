name: Run QA CI

on:
  push:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Setup Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test --stop-on-failure || true

      - name: Skip migrations (QA mode)
        run: echo "Skipping migrations for QA CI"

      - name: Skip seeding (QA mode)
        run: echo "Skipping database seeding for QA CI"
